name: GSModz Build APK

on:
  push:
    branches: [ main, gsmodz-ff ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu-latest runner already ships a full Android SDK
      # (cmdline-tools included) under ANDROID_HOME/ANDROID_SDK_ROOT — no
      # need for a separate setup-android action, which was trying to
      # install the no-longer-published legacy "tools" package and
      # failing outright.
      - name: Install NDK 21.4.7075529
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;21.4.7075529"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.0"

      - name: Build release APK
        run: gradle assembleRelease --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/21.4.7075529

      # Debug: find where ndk-build's "injector" executable actually landed
      # and whether copyInjectorAsSo's output directory has anything in it
      # at all, instead of guessing why the previous run's glob found
      # nothing.
      - name: Locate injector build output
        if: always()
        run: |
          echo "--- searching whole build/ tree for a file named exactly 'injector' ---"
          find app/build -type f -name "injector" 2>/dev/null
          echo "--- contents of the copy task's target dir ---"
          find app/build/injectorLibs 2>/dev/null || echo "(injectorLibs dir does not exist)"
          echo "--- contents of intermediates/cxx, two levels deep ---"
          find app/build/intermediates/cxx -maxdepth 4 2>/dev/null

      # Verifies for real (not assumed) whether the new "injector" executable
      # module actually ends up packaged inside the built APK, since AGP's
      # handling of a non-.so ndk-build output isn't something to assume.
      - name: List native libs packaged in the APK
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Inspecting: $APK"
          unzip -l "$APK" | grep -E "lib/" || echo "NO lib/ ENTRIES FOUND AT ALL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gsmodz-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
