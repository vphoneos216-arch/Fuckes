name: Build Obfuscated (O-MVLL)

# Run manually from the Actions tab, or on every push to main/master.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  # O-MVLL moved to NDK r29 starting with v1.9.0 — the old r26d-targeted
  # releases (v1.8.0 and earlier) are no longer published anywhere
  # downloadable (confirmed: GitHub Releases has tags but no attached
  # binaries for them, and the project's own experimental-build index
  # only carries v1.10.0+ builds). So this now tracks current O-MVLL.
  NDK_VERSION: r29

permissions:
  contents: write
  issues: write

jobs:
  # ===================================================================
  # Builds a PRIVATE, renamed OpenSSL 3.x libcrypto.a for android-arm64,
  # used ONLY for Ed448 verification. The project's existing bundled
  # OpenSSL (jni/include/external/openssl-android-arm64-v8a) is 1.1.0c
  # from 2016 — Ed25519/Ed448 EVP support didn't exist until 1.1.1
  # (2018), confirmed absent (no NID_ED448 in its headers). Can't just
  # swap it for a newer one: curl-android was built against that exact
  # 1.1.0c ABI, and every symbol (EVP_PKEY_free, BIO_new, …) has the
  # SAME name in any OpenSSL version, so linking two versions statically
  # in one binary is a "duplicate symbol" linker error. Fix: rename every
  # global symbol in the NEW library with a kdoss3_ prefix via objcopy,
  # and ship a matching #define header so our own code's calls get
  # rewritten to the prefixed names at OUR compile time too. Zero chance
  # of collision with the old library either side.
  # ===================================================================
  build-ed448-lib:
    runs-on: ubuntu-24.04
    outputs:
      built: ${{ steps.build.outcome }}
    steps:
      - name: Set up Android NDK ${{ env.NDK_VERSION }}
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Clone OpenSSL (pinned release)
        run: |
          set -e
          git clone --depth 1 --branch openssl-3.3.2 https://github.com/openssl/openssl /tmp/openssl-src

      - name: Configure + build libcrypto for android-arm64
        id: build
        run: |
          set -e
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          export ANDROID_NDK_ROOT="$NDK"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd /tmp/openssl-src
          ./Configure android-arm64 -D__ANDROID_API__=28 \
            no-shared no-tests no-apps no-engine no-deprecated
          make -j"$(nproc)" build_libs
          ls -la libcrypto.a
          file libcrypto.a

      - name: Rename every global symbol (kdoss3_ prefix)
        run: |
          set -e
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          OBJCOPY="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy"
          AR="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          NM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          cd /tmp/openssl-src

          mkdir -p /tmp/objs && cd /tmp/objs
          "$AR" x /tmp/openssl-src/libcrypto.a

          # Collect every globally-DEFINED symbol across all objects (T/D/B/R/W,
          # uppercase = defined&external in nm's output), unique, non-empty.
          "$NM" --defined-only -g *.o 2>/dev/null \
            | awk '{print $3}' | sort -u | grep -v '^$' > /tmp/syms.txt
          wc -l /tmp/syms.txt

          # objcopy redefine-syms file: "<old> <new>" per line.
          awk '{print $1, "kdoss3_" $1}' /tmp/syms.txt > /tmp/redefine.txt

          for o in *.o; do
            "$OBJCOPY" --redefine-syms=/tmp/redefine.txt "$o"
          done

          "$AR" rcs /tmp/libcrypto_kdoss3.a *.o
          "$NM" --defined-only -g /tmp/libcrypto_kdoss3.a | grep -c kdoss3_ || true

          # #define <old> kdoss3_<old>  — included BEFORE any <openssl/*.h>
          # in our own code, so our calls to e.g. EVP_PKEY_new() resolve to
          # kdoss3_EVP_PKEY_new() and match the renamed archive.
          awk '{print "#define " $1 " kdoss3_" $1}' /tmp/syms.txt > /tmp/kd_ossl_rename.h

      - name: Package headers + renamed lib
        run: |
          set -e
          mkdir -p /tmp/ed448lib/include
          cp -r /tmp/openssl-src/include/openssl /tmp/ed448lib/include/openssl
          cp /tmp/libcrypto_kdoss3.a /tmp/ed448lib/libcrypto_kdoss3.a
          cp /tmp/kd_ossl_rename.h /tmp/ed448lib/kd_ossl_rename.h
          cd /tmp/ed448lib && tar czf /tmp/ed448lib.tar.gz .
          ls -la /tmp/ed448lib.tar.gz

      - name: Upload (consumed by the main build job)
        uses: actions/upload-artifact@v4
        with:
          name: ed448lib
          path: /tmp/ed448lib.tar.gz
          if-no-files-found: error

  build:
    needs: build-ed448-lib
    # NOT 22.04: this O-MVLL build needs GLIBC_2.38, which 22.04 doesn't
    # have (confirmed via a real failed run: "GLIBC_2.38' not found").
    # 24.04 ships glibc 2.39.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Ed448 lib (from build-ed448-lib job)
        uses: actions/download-artifact@v4
        with:
          name: ed448lib
          path: /tmp/ed448lib-download

      - name: Unpack Ed448 lib into jni/include/external
        run: |
          set -e
          mkdir -p jni/include/external/openssl3-ed448/include
          tar xzf /tmp/ed448lib-download/ed448lib.tar.gz -C jni/include/external/openssl3-ed448
          ls -la jni/include/external/openssl3-ed448

      - name: Set up Android NDK ${{ env.NDK_VERSION }}
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Download O-MVLL plugin (latest linux build)
        run: |
          set -e
          # open-obfuscator's GitHub Releases no longer carry binary assets
          # for any version (confirmed: tags exist, "Assets" is empty) — the
          # only place O-MVLL actually ships linux builds is this public
          # index. Its index.html is apparently awkward to scrape reliably
          # from a plain curl (tried, got zero matches twice), so instead we
          # try a short list of known-good direct links, newest first, and
          # fall through until one downloads. Confirmed present as of
          # 2026-10-29 via direct fetch.
          CANDIDATES=(
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-10-29T09:09:16.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-10-06T09:20:43.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-10-01T09:30:05.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-09-29T11:51:26.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-09-29T11:41:51.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-09-29T10:01:31.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-10-0_linux_2026-09-29T09:26:56.tar.gz"
          )
          URL=""
          for c in "${CANDIDATES[@]}"; do
            echo "Trying: $c"
            if curl -fL --head -s -o /dev/null "$c"; then
              URL="$c"
              break
            fi
          done
          if [ -z "$URL" ]; then
            echo "::error::None of the known O-MVLL build URLs are reachable. The build38.io index may have rotated out all of them — open https://open-obfuscator.build38.io/ci/index.html in a browser, copy the newest *_linux_*.tar.gz link, and add it to CANDIDATES at the top of this workflow step."
            exit 1
          fi
          echo "Using: $URL"
          curl -fL -o "$HOME/omvll.tar.gz" "$URL"
          mkdir -p "$HOME/omvll"
          tar xzf "$HOME/omvll.tar.gz" -C "$HOME/omvll"
          echo "=== extracted contents ==="
          find "$HOME/omvll" -maxdepth 3

          SO=$(find "$HOME/omvll" -iname "*omvll*.so" | head -1)
          if [ -z "$SO" ]; then
            echo "::error::No .so file found inside the downloaded archive."
            exit 1
          fi
          echo "OMVLL_SO=$SO" >> "$GITHUB_ENV"

          PYDIR=$(find "$HOME/omvll" -maxdepth 2 -type d -iname "Python-*" | head -1)
          if [ -z "$PYDIR" ]; then
            echo "::error::No bundled Python-3.x stdlib folder found inside the archive."
            exit 1
          fi
          echo "OMVLL_PYTHONPATH=$PYDIR/Lib" >> "$GITHUB_ENV"

      - name: Build (ndk-build + O-MVLL)
        id: ndkbuild
        continue-on-error: true
        env:
          OMVLL_CONFIG: ${{ github.workspace }}/omvll_config.py
        run: |
          set -o pipefail
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          # O-MVLL (a Clang plugin) needs the NDK's libc++ at load time.
          export LD_LIBRARY_PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/lib:$NDK/toolchains/llvm/prebuilt/linux-x86_64/lib64:${LD_LIBRARY_PATH:-}"
          echo "OMVLL_CONFIG=$OMVLL_CONFIG"
          echo "OMVLL_PYTHONPATH=$OMVLL_PYTHONPATH"
          echo "OMVLL_SO=$OMVLL_SO"
          "$NDK/ndk-build" \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=jni/Application.mk \
            OMVLL_PLUGIN="$OMVLL_SO" \
            V=1 \
            -j"$(nproc)" 2>&1 | tee /tmp/build.log

      - name: Report build failure as an issue (log isn't otherwise reachable)
        if: steps.ndkbuild.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build failed on run ${{ github.run_id }} (commit ${{ github.sha }})."
            echo
            echo '```'
            tail -c 55000 /tmp/build.log
            echo '```'
          } > /tmp/build_tail.md
          gh issue create --repo "${{ github.repository }}" \
            --title "CI build failure log: run ${{ github.run_id }}" \
            --body-file /tmp/build_tail.md

      - name: Fail job if the build step failed
        if: steps.ndkbuild.outcome == 'failure'
        run: exit 1

      - name: Show result (pre-UPX)
        run: |
          echo "=== built binary ==="
          ls -la libs/arm64-v8a/ || true
          file libs/arm64-v8a/stranger.sh || true

      - name: UPX packing — DISABLED
        run: |
          # [DISABLED] UPX-packed PIE executables fail to load on-device:
          # modern Android's bionic dynamic linker (observed on a real
          # device, Android with a recent security patch level) performs a
          # strict ELF section-header sanity check that UPX's compressed
          # stub does not satisfy — it fails with:
          #   "<path> has unsupported e_shentsize: 0x0 (expected 0x40)"
          # UPX's own test suite only validates against glibc/desktop
          # loaders, not bionic, so this incompatibility doesn't show up
          # until actual on-device execution. The binary WAS valid and ran
          # fine pre-UPX (file(1) confirmed a sane PIE ELF) — this is
          # strictly a packing-stage problem, not a build or signing one.
          # O-MVLL's compiler-level obfuscation (control-flow flattening,
          # opaque constants, string encoding, anti-hooking) is unaffected
          # and remains the primary protection layer; this step is now a
          # no-op so libs/arm64-v8a/stranger.sh stays the unpacked,
          # O-MVLL-obfuscated, stripped binary all the way through.
          echo "UPX packing is disabled — shipping unpacked (O-MVLL-obfuscated, stripped) binary."
          file libs/arm64-v8a/stranger.sh || true

      - name: Show result (final)
        run: |
          echo "=== final binary ==="
          ls -la libs/arm64-v8a/ || true
          file libs/arm64-v8a/stranger.sh || true

      - name: Upload obfuscated binary (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: stranger-obfuscated-arm64
          path: libs/arm64-v8a/stranger.sh
          if-no-files-found: error

      - name: Also commit the binary to a dist branch
        # Actions artifacts live on Azure blob storage, which isn't reachable
        # from the environment that drives this workflow — so also push the
        # built binary as a normal git object, which IS reachable (plain
        # https://github.com/... clone/fetch).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/dist-checkout
          git -C /tmp/dist-checkout init -q
          git -C /tmp/dist-checkout remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git -C /tmp/dist-checkout checkout -q -B dist-builds
          cp libs/arm64-v8a/stranger.sh /tmp/dist-checkout/stranger.sh
          git -C /tmp/dist-checkout config user.name "github-actions[bot]"
          git -C /tmp/dist-checkout config user.email "github-actions[bot]@users.noreply.github.com"
          git -C /tmp/dist-checkout add stranger.sh
          git -C /tmp/dist-checkout commit -q -m "built binary from run ${{ github.run_id }} (commit ${{ github.sha }})"
          git -C /tmp/dist-checkout push -q -f origin dist-builds
