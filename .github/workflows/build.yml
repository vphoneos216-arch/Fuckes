name: Build Obfuscated (O-MVLL)

# Run manually from the Actions tab, or on every push to main/master.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  # O-MVLL moved to NDK r29 starting with v1.9.0 — the old r26d-targeted
  # releases (v1.8.0 and earlier) are no longer published anywhere
  # downloadable (confirmed: GitHub Releases has tags but no attached
  # binaries for them, and the project's own experimental-build index
  # only carries v1.10.0+ builds). So this now tracks current O-MVLL.
  NDK_VERSION: r29

permissions:
  contents: write
  issues: write

jobs:
  # ===================================================================
  # Builds a PRIVATE, renamed OpenSSL 3.x libcrypto.a for android-arm64,
  # used ONLY for Ed448 verification. The project's existing bundled
  # OpenSSL (jni/include/external/openssl-android-arm64-v8a) is 1.1.0c
  # from 2016 — Ed25519/Ed448 EVP support didn't exist until 1.1.1
  # (2018), confirmed absent (no NID_ED448 in its headers). Can't just
  # swap it for a newer one: curl-android was built against that exact
  # 1.1.0c ABI, and every symbol (EVP_PKEY_free, BIO_new, …) has the
  # SAME name in any OpenSSL version, so linking two versions statically
  # in one binary is a "duplicate symbol" linker error. Fix: rename every
  # global symbol in the NEW library with a kdoss3_ prefix via objcopy,
  # and ship a matching #define header so our own code's calls get
  # rewritten to the prefixed names at OUR compile time too. Zero chance
  # of collision with the old library either side.
  # ===================================================================
  build-ed448-lib:
    runs-on: ubuntu-24.04
    outputs:
      built: ${{ steps.build.outcome }}
    steps:
      - name: Set up Android NDK ${{ env.NDK_VERSION }}
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Clone OpenSSL (pinned release)
        run: |
          set -e
          git clone --depth 1 --branch openssl-3.3.2 https://github.com/openssl/openssl /tmp/openssl-src

      - name: Configure + build libcrypto for android-arm64
        id: build
        run: |
          set -e
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          export ANDROID_NDK_ROOT="$NDK"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd /tmp/openssl-src
          ./Configure android-arm64 -D__ANDROID_API__=28 \
            no-shared no-tests no-apps no-engine no-deprecated
          make -j"$(nproc)" build_libs
          ls -la libcrypto.a
          file libcrypto.a

      - name: Rename every global symbol (kdoss3_ prefix)
        run: |
          set -e
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          OBJCOPY="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy"
          AR="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          NM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          cd /tmp/openssl-src

          mkdir -p /tmp/objs && cd /tmp/objs
          "$AR" x /tmp/openssl-src/libcrypto.a

          # Collect every globally-DEFINED symbol across all objects (T/D/B/R/W,
          # uppercase = defined&external in nm's output), unique, non-empty.
          "$NM" --defined-only -g *.o 2>/dev/null \
            | awk '{print $3}' | sort -u | grep -v '^$' > /tmp/syms.txt
          wc -l /tmp/syms.txt

          # objcopy redefine-syms file: "<old> <new>" per line.
          awk '{print $1, "kdoss3_" $1}' /tmp/syms.txt > /tmp/redefine.txt

          for o in *.o; do
            "$OBJCOPY" --redefine-syms=/tmp/redefine.txt "$o"
          done

          "$AR" rcs /tmp/libcrypto_kdoss3.a *.o
          "$NM" --defined-only -g /tmp/libcrypto_kdoss3.a | grep -c kdoss3_ || true

          # #define <old> kdoss3_<old>  — included BEFORE any <openssl/*.h>
          # in our own code, so our calls to e.g. EVP_PKEY_new() resolve to
          # kdoss3_EVP_PKEY_new() and match the renamed archive.
          awk '{print "#define " $1 " kdoss3_" $1}' /tmp/syms.txt > /tmp/kd_ossl_rename.h

      - name: Package headers + renamed lib
        run: |
          set -e
          mkdir -p /tmp/ed448lib/include
          cp -r /tmp/openssl-src/include/openssl /tmp/ed448lib/include/openssl
          cp /tmp/libcrypto_kdoss3.a /tmp/ed448lib/libcrypto_kdoss3.a
          cp /tmp/kd_ossl_rename.h /tmp/ed448lib/kd_ossl_rename.h
          cd /tmp/ed448lib && tar czf /tmp/ed448lib.tar.gz .
          ls -la /tmp/ed448lib.tar.gz

      - name: Upload (consumed by the main build job)
        uses: actions/upload-artifact@v4
        with:
          name: ed448lib
          path: /tmp/ed448lib.tar.gz
          if-no-files-found: error

  # ===================================================================
  # ML-DSA-65 (FIPS 204, post-quantum) — THIRD, independent hybrid
  # signature leg. Cross-compiles liboqs for android-arm64 (client-side
  # verification only — the client never holds or needs a private key).
  # liboqs' OQS_* symbols don't collide with anything else in the
  # project, so no symbol-renaming is needed here (unlike Ed448).
  # OQS_USE_OPENSSL=OFF keeps it fully self-contained (liboqs' own
  # portable implementations), avoiding any entanglement with the
  # project's existing bundled OpenSSL 1.1.0c. OQS_MINIMAL_BUILD trims
  # the build to just the one algorithm this project uses, cutting
  # build time drastically (liboqs enables dozens of KEM+SIG algorithms
  # by default).
  # ===================================================================
  build-mldsa-android-lib:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Android NDK ${{ env.NDK_VERSION }}
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Clone liboqs (pinned release)
        run: |
          set -e
          git clone --depth 1 --branch 0.12.0 https://github.com/open-quantum-safe/liboqs /tmp/liboqs-src

      - name: Configure + build for android-arm64
        run: |
          set -e
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          cmake -S /tmp/liboqs-src -B /tmp/liboqs-build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DOQS_USE_OPENSSL=OFF \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DOQS_MINIMAL_BUILD="SIG_ml_dsa_65" \
            -DCMAKE_INSTALL_PREFIX=/tmp/liboqs-install-android
          cmake --build /tmp/liboqs-build-android -j"$(nproc)"
          cmake --install /tmp/liboqs-build-android
          ls -la /tmp/liboqs-install-android/lib
          file /tmp/liboqs-install-android/lib/liboqs.a

      - name: Package for the main build job
        run: |
          set -e
          mkdir -p /tmp/liboqs-android-pkg
          cp -r /tmp/liboqs-install-android/lib /tmp/liboqs-android-pkg/lib
          cp -r /tmp/liboqs-install-android/include /tmp/liboqs-android-pkg/include
          cd /tmp/liboqs-android-pkg && tar czf /tmp/liboqs-android.tar.gz .
          ls -la /tmp/liboqs-android.tar.gz

      - name: Upload (consumed by the main build job)
        uses: actions/upload-artifact@v4
        with:
          name: liboqs-android
          path: /tmp/liboqs-android.tar.gz
          if-no-files-found: error

  # ===================================================================
  # Server-side ML-DSA-65 CLI tool — a fully static x86_64-linux binary
  # (tools/kd_mldsa_tool.c) that the cPanel server calls via shell_exec
  # (same pattern keydock_connect.php already uses for the Ed448 CLI
  # openssl calls) to sign each response's "sig3". Static linking means
  # it doesn't care what glibc version the shared host actually has
  # (confirmed host: glibc 2.34) — everything it needs is baked in.
  # Also used ONCE, outside this workflow, to generate the deployment
  # keypair (run directly in whatever x86_64 Linux environment drives
  # this repo, since that tool binary runs there too).
  # ===================================================================
  build-mldsa-server-tool:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone liboqs (pinned release)
        run: |
          set -e
          git clone --depth 1 --branch 0.12.0 https://github.com/open-quantum-safe/liboqs /tmp/liboqs-src-x64

      - name: Configure + build liboqs for x86_64-linux (static)
        run: |
          set -e
          cmake -S /tmp/liboqs-src-x64 -B /tmp/liboqs-build-x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DOQS_USE_OPENSSL=OFF \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DOQS_MINIMAL_BUILD="SIG_ml_dsa_65" \
            -DCMAKE_INSTALL_PREFIX=/tmp/liboqs-install-x64
          cmake --build /tmp/liboqs-build-x64 -j"$(nproc)"
          cmake --install /tmp/liboqs-build-x64

      - name: Build kd_mldsa_tool (fully static)
        run: |
          set -e
          gcc -O2 -static -o /tmp/kd_mldsa_tool tools/kd_mldsa_tool.c \
            -I/tmp/liboqs-install-x64/include \
            /tmp/liboqs-install-x64/lib/liboqs.a
          file /tmp/kd_mldsa_tool
          ldd /tmp/kd_mldsa_tool || true   # expect "not a dynamic executable"
          /tmp/kd_mldsa_tool keygen /tmp/selftest_priv.bin /tmp/selftest_pub.bin
          echo "selftest message" > /tmp/selftest_msg.bin
          /tmp/kd_mldsa_tool sign /tmp/selftest_priv.bin /tmp/selftest_msg.bin /tmp/selftest_sig.bin
          ls -la /tmp/selftest_sig.bin
          echo "self-test OK: keygen + sign both ran successfully"

      - name: Upload (fetched directly, not consumed by the build job)
        uses: actions/upload-artifact@v4
        with:
          name: kd-mldsa-tool
          path: /tmp/kd_mldsa_tool
          if-no-files-found: error

      - name: Also commit the tool to its own dist branch (artifact storage isn't reachable from the driving environment)
        # A SEPARATE branch from dist-builds (which the main `build` job
        # force-pushes stranger.sh to): both jobs create a throwaway local
        # branch from scratch and force-push it, so sharing one branch
        # name would have the later push silently wipe out the earlier
        # job's file. dist-tools is this job's own namespace.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/dist-tool-checkout
          git -C /tmp/dist-tool-checkout init -q
          git -C /tmp/dist-tool-checkout remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git -C /tmp/dist-tool-checkout checkout -q -B dist-tools
          cp /tmp/kd_mldsa_tool /tmp/dist-tool-checkout/kd_mldsa_tool
          git -C /tmp/dist-tool-checkout config user.name "github-actions[bot]"
          git -C /tmp/dist-tool-checkout config user.email "github-actions[bot]@users.noreply.github.com"
          git -C /tmp/dist-tool-checkout add kd_mldsa_tool
          git -C /tmp/dist-tool-checkout commit -q -m "kd_mldsa_tool from run ${{ github.run_id }} (commit ${{ github.sha }})"
          git -C /tmp/dist-tool-checkout push -q -f origin dist-tools

  build:
    needs: [build-ed448-lib, build-mldsa-android-lib]
    # NOT 22.04: this O-MVLL build needs GLIBC_2.38, which 22.04 doesn't
    # have (confirmed via a real failed run: "GLIBC_2.38' not found").
    # 24.04 ships glibc 2.39.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Ed448 lib (from build-ed448-lib job)
        uses: actions/download-artifact@v4
        with:
          name: ed448lib
          path: /tmp/ed448lib-download

      - name: Unpack Ed448 lib into jni/include/external
        run: |
          set -e
          mkdir -p jni/include/external/openssl3-ed448/include
          tar xzf /tmp/ed448lib-download/ed448lib.tar.gz -C jni/include/external/openssl3-ed448
          ls -la jni/include/external/openssl3-ed448

      - name: Download liboqs (ML-DSA-65) lib (from build-mldsa-android-lib job)
        uses: actions/download-artifact@v4
        with:
          name: liboqs-android
          path: /tmp/liboqs-android-download

      - name: Unpack liboqs lib into jni/include/external
        run: |
          set -e
          mkdir -p jni/include/external/liboqs-android
          tar xzf /tmp/liboqs-android-download/liboqs-android.tar.gz -C jni/include/external/liboqs-android
          ls -la jni/include/external/liboqs-android

      - name: Set up Android NDK ${{ env.NDK_VERSION }}
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Download O-MVLL plugin (latest linux build)
        run: |
          set -e
          # open-obfuscator's GitHub Releases no longer carry binary assets
          # for any version (confirmed: tags exist, "Assets" is empty) — the
          # only place O-MVLL actually ships linux builds is this public
          # index. Its index.html is apparently awkward to scrape reliably
          # from a plain curl (tried, got zero matches twice), so instead we
          # try a short list of known-good direct links, newest first, and
          # fall through until one downloads. Confirmed present as of
          # 2026-10-29 via direct fetch.
          CANDIDATES=(
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-10-29T09:09:16.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-10-06T09:20:43.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-10-01T09:30:05.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-09-29T11:51:26.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-09-29T11:41:51.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-09-29T10:01:31.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-10-0_linux_2026-09-29T09:26:56.tar.gz"
          )
          URL=""
          for c in "${CANDIDATES[@]}"; do
            echo "Trying: $c"
            if curl -fL --head -s -o /dev/null "$c"; then
              URL="$c"
              break
            fi
          done
          if [ -z "$URL" ]; then
            echo "::error::None of the known O-MVLL build URLs are reachable. The build38.io index may have rotated out all of them — open https://open-obfuscator.build38.io/ci/index.html in a browser, copy the newest *_linux_*.tar.gz link, and add it to CANDIDATES at the top of this workflow step."
            exit 1
          fi
          echo "Using: $URL"
          curl -fL -o "$HOME/omvll.tar.gz" "$URL"
          mkdir -p "$HOME/omvll"
          tar xzf "$HOME/omvll.tar.gz" -C "$HOME/omvll"
          echo "=== extracted contents ==="
          find "$HOME/omvll" -maxdepth 3

          SO=$(find "$HOME/omvll" -iname "*omvll*.so" | head -1)
          if [ -z "$SO" ]; then
            echo "::error::No .so file found inside the downloaded archive."
            exit 1
          fi
          echo "OMVLL_SO=$SO" >> "$GITHUB_ENV"

          PYDIR=$(find "$HOME/omvll" -maxdepth 2 -type d -iname "Python-*" | head -1)
          if [ -z "$PYDIR" ]; then
            echo "::error::No bundled Python-3.x stdlib folder found inside the archive."
            exit 1
          fi
          echo "OMVLL_PYTHONPATH=$PYDIR/Lib" >> "$GITHUB_ENV"

      - name: Build (ndk-build + O-MVLL)
        id: ndkbuild
        continue-on-error: true
        env:
          OMVLL_CONFIG: ${{ github.workspace }}/omvll_config.py
        run: |
          set -o pipefail
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          # O-MVLL (a Clang plugin) needs the NDK's libc++ at load time.
          export LD_LIBRARY_PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/lib:$NDK/toolchains/llvm/prebuilt/linux-x86_64/lib64:${LD_LIBRARY_PATH:-}"
          echo "OMVLL_CONFIG=$OMVLL_CONFIG"
          echo "OMVLL_PYTHONPATH=$OMVLL_PYTHONPATH"
          echo "OMVLL_SO=$OMVLL_SO"
          "$NDK/ndk-build" \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=jni/Application.mk \
            OMVLL_PLUGIN="$OMVLL_SO" \
            V=1 \
            -j"$(nproc)" 2>&1 | tee /tmp/build.log

      - name: Report build failure as an issue (log isn't otherwise reachable)
        if: steps.ndkbuild.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build failed on run ${{ github.run_id }} (commit ${{ github.sha }})."
            echo
            echo '```'
            tail -c 55000 /tmp/build.log
            echo '```'
          } > /tmp/build_tail.md
          gh issue create --repo "${{ github.repository }}" \
            --title "CI build failure log: run ${{ github.run_id }}" \
            --body-file /tmp/build_tail.md

      - name: Fail job if the build step failed
        if: steps.ndkbuild.outcome == 'failure'
        run: exit 1

      - name: Show result (pre-UPX)
        run: |
          echo "=== built binary ==="
          ls -la libs/arm64-v8a/ || true
          file libs/arm64-v8a/stranger.sh || true

      - name: Pack with UPX (latest upstream release, Android-aware)
        run: |
          set -e
          # [RE-ENABLED, per explicit request] A PREVIOUS attempt packed
          # with Ubuntu's apt "upx-ucl" package and the result crashed
          # bionic's linker ("has unsupported e_shentsize: 0x0 (expected
          # 0x40)") — that apt package is an old UPX build with no
          # Android-specific handling. Upstream UPX added explicit
          # Android/bionic ELF support in more recent releases, so this
          # now fetches the latest upx/upx GitHub release directly instead
          # of the distro package, and — critically — VERIFIES the packed
          # binary's ELF header is sane (readelf) before keeping it. If
          # it still isn't, this step falls back to the unpacked binary
          # automatically rather than shipping something that is known to
          # fail on-device; the "Show result (final)" step right after
          # shows which one actually shipped.
          UPX_VER=$(curl -fsSL https://api.github.com/repos/upx/upx/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "Latest UPX release: $UPX_VER"
          curl -fL -o /tmp/upx.tar.xz \
            "https://github.com/upx/upx/releases/download/v${UPX_VER}/upx-${UPX_VER}-amd64_linux.tar.xz"
          mkdir -p /tmp/upx-extract
          tar xJf /tmp/upx.tar.xz -C /tmp/upx-extract --strip-components=1
          UPX_BIN=/tmp/upx-extract/upx
          "$UPX_BIN" --version | head -3

          cp libs/arm64-v8a/stranger.sh /tmp/stranger_prepack.sh
          ORIG_SIZE=$(stat -c%s /tmp/stranger_prepack.sh)

          PACK_OK=0
          if "$UPX_BIN" --best --lzma -o /tmp/stranger_packed.sh libs/arm64-v8a/stranger.sh; then
            file /tmp/stranger_packed.sh
            # Sanity-check the packed ELF header the same way bionic's
            # linker does: e_shnum/e_shentsize must either both be 0, or
            # e_shentsize must equal 64 (sizeof(Elf64_Shdr)). readelf -h
            # prints both; parse and compare instead of trusting that
            # "upx ran without error" means "bionic will load this".
            SHNUM=$(readelf -h /tmp/stranger_packed.sh | awk -F': *' '/Number of section headers/ {print $2}')
            SHENTSIZE=$(readelf -h /tmp/stranger_packed.sh | awk -F': *' '/Size of section headers/ {print $2}')
            echo "packed ELF: e_shnum=$SHNUM e_shentsize=$SHENTSIZE"
            if { [ "$SHNUM" = "0" ] && [ "$SHENTSIZE" = "0" ]; } || [ "$SHENTSIZE" = "64" ]; then
              PACK_OK=1
            else
              echo "::warning::Packed ELF header looks bionic-incompatible (e_shnum=$SHNUM e_shentsize=$SHENTSIZE, expected both-zero or entsize=64) — keeping the unpacked binary instead."
            fi
          else
            echo "::warning::UPX packing command failed — keeping the unpacked binary instead."
          fi

          if [ "$PACK_OK" = "1" ]; then
            NEW_SIZE=$(stat -c%s /tmp/stranger_packed.sh)
            echo "Original: $ORIG_SIZE bytes -> Packed: $NEW_SIZE bytes (header looks bionic-safe)"
            cp /tmp/stranger_packed.sh libs/arm64-v8a/stranger.sh
          else
            echo "Shipping the UNPACKED binary (still O-MVLL-obfuscated + stripped) — see warning above for why."
          fi

      - name: Show result (final)
        run: |
          echo "=== final binary ==="
          ls -la libs/arm64-v8a/ || true
          file libs/arm64-v8a/stranger.sh || true

      - name: Upload obfuscated binary (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: stranger-obfuscated-arm64
          path: libs/arm64-v8a/stranger.sh
          if-no-files-found: error

      - name: Also commit the binary to a dist branch
        # Actions artifacts live on Azure blob storage, which isn't reachable
        # from the environment that drives this workflow — so also push the
        # built binary as a normal git object, which IS reachable (plain
        # https://github.com/... clone/fetch).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/dist-checkout
          git -C /tmp/dist-checkout init -q
          git -C /tmp/dist-checkout remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git -C /tmp/dist-checkout checkout -q -B dist-builds
          cp libs/arm64-v8a/stranger.sh /tmp/dist-checkout/stranger.sh
          git -C /tmp/dist-checkout config user.name "github-actions[bot]"
          git -C /tmp/dist-checkout config user.email "github-actions[bot]@users.noreply.github.com"
          git -C /tmp/dist-checkout add stranger.sh
          git -C /tmp/dist-checkout commit -q -m "built binary from run ${{ github.run_id }} (commit ${{ github.sha }})"
          git -C /tmp/dist-checkout push -q -f origin dist-builds
