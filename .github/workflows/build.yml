name: Build Obfuscated (O-MVLL)

# Run manually from the Actions tab, or on every push to main/master.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  # O-MVLL moved to NDK r29 starting with v1.9.0 — the old r26d-targeted
  # releases (v1.8.0 and earlier) are no longer published anywhere
  # downloadable (confirmed: GitHub Releases has tags but no attached
  # binaries for them, and the project's own experimental-build index
  # only carries v1.10.0+ builds). So this now tracks current O-MVLL.
  NDK_VERSION: r29

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android NDK ${{ env.NDK_VERSION }}
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Download O-MVLL plugin (latest linux build)
        run: |
          set -e
          echo "=== fetching build index ==="
          curl -fsSL "https://open-obfuscator.build38.io/ci/index.html" -o /tmp/index.html
          echo "=== raw index.html ==="
          cat /tmp/index.html
          echo "======================="
          # Pull every href/url pointing at a linux .tar.gz, whether the
          # timestamp's colons are literal or percent-encoded, then decode
          # %3A -> : and take the lexicographically-last (= newest) one.
          URL=$(grep -oE '(https://open-obfuscator\.build38\.io)?/?ci/[A-Za-z0-9._%-]*_linux_[A-Za-z0-9._%-]*\.tar\.gz' /tmp/index.html \
                | sed -e 's/%3A/:/gI' -e 's#^/*ci/#https://open-obfuscator.build38.io/ci/#' \
                | sort | tail -1)
          if [ -z "$URL" ]; then
            echo "::error::No linux O-MVLL build link found on the index page (see raw HTML dumped above)."
            exit 1
          fi
          echo "Using: $URL"
          curl -fL -o "$HOME/omvll.tar.gz" "$URL"
          mkdir -p "$HOME/omvll"
          tar xzf "$HOME/omvll.tar.gz" -C "$HOME/omvll"
          echo "=== extracted contents ==="
          find "$HOME/omvll" -maxdepth 3

          SO=$(find "$HOME/omvll" -iname "*omvll*.so" | head -1)
          if [ -z "$SO" ]; then
            echo "::error::No .so file found inside the downloaded archive."
            exit 1
          fi
          echo "OMVLL_SO=$SO" >> "$GITHUB_ENV"

          PYDIR=$(find "$HOME/omvll" -maxdepth 2 -type d -iname "Python-*" | head -1)
          if [ -z "$PYDIR" ]; then
            echo "::error::No bundled Python-3.x stdlib folder found inside the archive."
            exit 1
          fi
          echo "OMVLL_PYTHONPATH=$PYDIR/Lib" >> "$GITHUB_ENV"

      - name: Build (ndk-build + O-MVLL)
        env:
          OMVLL_CONFIG: ${{ github.workspace }}/omvll_config.py
        run: |
          set -e
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          # O-MVLL (a Clang plugin) needs the NDK's libc++ at load time.
          export LD_LIBRARY_PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/lib:$NDK/toolchains/llvm/prebuilt/linux-x86_64/lib64:${LD_LIBRARY_PATH:-}"
          echo "OMVLL_CONFIG=$OMVLL_CONFIG"
          echo "OMVLL_PYTHONPATH=$OMVLL_PYTHONPATH"
          echo "OMVLL_SO=$OMVLL_SO"
          "$NDK/ndk-build" \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=jni/Application.mk \
            OMVLL_PLUGIN="$OMVLL_SO" \
            -j"$(nproc)"

      - name: Show result
        run: |
          echo "=== built binary ==="
          ls -la libs/arm64-v8a/ || true
          file libs/arm64-v8a/stranger.sh || true

      - name: Upload obfuscated binary
        uses: actions/upload-artifact@v4
        with:
          name: stranger-obfuscated-arm64
          path: libs/arm64-v8a/stranger.sh
          if-no-files-found: error
