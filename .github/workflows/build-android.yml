name: Build InvisibleX Android App

# Run manually from the Actions tab, or on every push to main/master
# that touches the android-app/ folder.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch built INX.SH engine from dist-builds branch as native lib
        # "pura native convert" — the engine now ships as jniLibs/arm64-v8a/libINX.so
        # instead of an assets/INX.SH that had to be extracted + chmod'd at
        # runtime. Android's own installer extracts/places/executes jniLibs
        # content, so this is the standard native-packaging path.
        working-directory: .
        run: |
          set -e
          git fetch --depth 1 origin dist-builds
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a
          git show origin/dist-builds:INX.SH > android-app/app/src/main/jniLibs/arm64-v8a/libINX.so
          chmod 755 android-app/app/src/main/jniLibs/arm64-v8a/libINX.so
          ls -la android-app/app/src/main/jniLibs/arm64-v8a/libINX.so

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        # ubuntu-24.04 runner images ship with the Android SDK preinstalled
        # (ANDROID_HOME already set) — no setup-android action needed,
        # just make sure the licenses are accepted for this SDK version.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Ensure Android NDK + CMake are installed
        # The native auth module (app/src/main/cpp) now needs the NDK and
        # CMake via Gradle's externalNativeBuild — the preinstalled SDK on
        # this runner image only guarantees platform/build-tools, not NDK.
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;25.1.8937393" "cmake;3.22.1" > /dev/null
          echo "ndk.dir=$ANDROID_HOME/ndk/25.1.8937393" >> local.properties

      - name: Build liboqs (ML-DSA-65) for android-arm64
        # Same recipe as build.yml's build-mldsa-android-lib job, run
        # here too because that job's artifact doesn't cross workflow
        # boundaries — this app needs its own copy to verify the
        # server's "sig3" (ix_auth.cpp's ix_verify_mldsa65()).
        working-directory: .
        run: |
          set -e
          NDK="$ANDROID_HOME/ndk/25.1.8937393"
          git clone --depth 1 --branch 0.12.0 https://github.com/open-quantum-safe/liboqs /tmp/liboqs-src
          cmake -S /tmp/liboqs-src -B /tmp/liboqs-build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DOQS_USE_OPENSSL=OFF \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DOQS_MINIMAL_BUILD="SIG_ml_dsa_65" \
            -DCMAKE_INSTALL_PREFIX=/tmp/liboqs-install-android
          cmake --build /tmp/liboqs-build-android -j"$(nproc)"
          cmake --install /tmp/liboqs-build-android
          mkdir -p android-app/app/src/main/cpp/external/liboqs-android-arm64-v8a
          cp -r /tmp/liboqs-install-android/lib android-app/app/src/main/cpp/external/liboqs-android-arm64-v8a/lib
          cp -r /tmp/liboqs-install-android/include android-app/app/src/main/cpp/external/liboqs-android-arm64-v8a/include
          ls -la android-app/app/src/main/cpp/external/liboqs-android-arm64-v8a/lib
          file android-app/app/src/main/cpp/external/liboqs-android-arm64-v8a/lib/liboqs.a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        id: debug_build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build-debug.log

      - name: Build release APK (unsigned)
        id: release_build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build-release.log

      - name: Push build logs to ci-logs branch on failure
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/ci-logs-checkout
          git -C /tmp/ci-logs-checkout init -q
          git -C /tmp/ci-logs-checkout remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git -C /tmp/ci-logs-checkout checkout -q -B ci-logs
          cp /tmp/build-debug.log /tmp/ci-logs-checkout/build-debug.log 2>/dev/null || true
          cp /tmp/build-release.log /tmp/ci-logs-checkout/build-release.log 2>/dev/null || true
          git -C /tmp/ci-logs-checkout config user.name "github-actions[bot]"
          git -C /tmp/ci-logs-checkout config user.email "github-actions[bot]@users.noreply.github.com"
          git -C /tmp/ci-logs-checkout add -A
          git -C /tmp/ci-logs-checkout commit -q -m "build logs from run ${{ github.run_id }} (commit ${{ github.sha }})"
          git -C /tmp/ci-logs-checkout push -q -f origin ci-logs

      - name: Locate APKs
        id: apks
        run: |
          echo "--- full apk output tree ---"
          find app/build/outputs/apk -type f 2>&1 || true
          # Custom outputFileName in build.gradle (InvisibleX-<version>.apk)
          # strips "debug"/"release" from the filename itself, so match by
          # the debug/release output SUBDIRECTORY, not the filename.
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n1)
          echo "debug_apk=$DEBUG_APK" >> "$GITHUB_OUTPUT"
          echo "release_apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "DEBUG_APK=[$DEBUG_APK]"
          echo "RELEASE_APK=[$RELEASE_APK]"
          test -n "$DEBUG_APK" && ls -la "$DEBUG_APK"
          test -n "$RELEASE_APK" && ls -la "$RELEASE_APK"
          if [ -z "$DEBUG_APK" ] && [ -z "$RELEASE_APK" ]; then
            echo "No APKs found at all — failing."
            exit 1
          fi

      - name: Upload debug APK artifact
        if: steps.apks.outputs.debug_apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: InvisibleX-debug
          path: android-app/${{ steps.apks.outputs.debug_apk }}
          retention-days: 30

      - name: Upload release APK artifact (unsigned)
        if: steps.apks.outputs.release_apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: InvisibleX-release-unsigned
          path: android-app/${{ steps.apks.outputs.release_apk }}
          retention-days: 30

      - name: Also push APKs to dist-android branch
        # Actions artifacts live on Azure blob storage, which isn't reachable
        # from the environment that drives this workflow — push the built
        # APKs as plain git objects too (reachable via normal git fetch),
        # same pattern as dist-builds for the INX.SH binary.
        if: steps.apks.outputs.debug_apk != '' || steps.apks.outputs.release_apk != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/dist-android-checkout
          git -C /tmp/dist-android-checkout init -q
          git -C /tmp/dist-android-checkout remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git -C /tmp/dist-android-checkout checkout -q -B dist-android
          [ -n "${{ steps.apks.outputs.debug_apk }}" ] && cp "android-app/${{ steps.apks.outputs.debug_apk }}" /tmp/dist-android-checkout/InvisibleX-debug.apk || true
          [ -n "${{ steps.apks.outputs.release_apk }}" ] && cp "android-app/${{ steps.apks.outputs.release_apk }}" /tmp/dist-android-checkout/InvisibleX-release-unsigned.apk || true
          git -C /tmp/dist-android-checkout config user.name "github-actions[bot]"
          git -C /tmp/dist-android-checkout config user.email "github-actions[bot]@users.noreply.github.com"
          git -C /tmp/dist-android-checkout add -A
          git -C /tmp/dist-android-checkout commit -q -m "APKs from run ${{ github.run_id }} (commit ${{ github.sha }})"
          git -C /tmp/dist-android-checkout push -q -f origin dist-android
