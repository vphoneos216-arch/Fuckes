name: Build InvisibleX Android App

# Run manually from the Actions tab, or on every push to main/master
# that touches the android-app/ folder.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch built INX.SH binary from dist-builds branch
        working-directory: .
        run: |
          set -e
          git fetch --depth 1 origin dist-builds
          git show origin/dist-builds:INX.SH > android-app/app/src/main/assets/INX.SH
          chmod 755 android-app/app/src/main/assets/INX.SH
          ls -la android-app/app/src/main/assets/INX.SH

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        # ubuntu-24.04 runner images ship with the Android SDK preinstalled
        # (ANDROID_HOME already set) — no setup-android action needed,
        # just make sure the licenses are accepted for this SDK version.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        run: gradle assembleRelease --no-daemon

      - name: Locate APKs
        id: apks
        run: |
          set -e
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          echo "debug_apk=$DEBUG_APK" >> "$GITHUB_OUTPUT"
          echo "release_apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          ls -la "$DEBUG_APK" "$RELEASE_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvisibleX-debug
          path: android-app/${{ steps.apks.outputs.debug_apk }}
          retention-days: 30

      - name: Upload release APK artifact (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: InvisibleX-release-unsigned
          path: android-app/${{ steps.apks.outputs.release_apk }}
          retention-days: 30
