name: Build Hardware BT (Aimbot + HWBPY, O-MVLL)

on:
  push:
    branches:
      - hardware-bt-aimbot-hwbpy
    paths:
      - 'hardware_bt/**'
      - '.github/workflows/hardware_bt.yml'
  workflow_dispatch: {}

env:
  NDK_VERSION: r29

jobs:
  # ===================================================================
  # Builds a PRIVATE, renamed OpenSSL 3.x libcrypto.a for android-arm64,
  # used ONLY for Ed448 verification -- ported verbatim from the main
  # InvisibleX workflow's build-ed448-lib job (.github/workflows/build.yml).
  # The bundled OpenSSL this project already has (openssl-android-arm64-v8a)
  # predates Ed25519/Ed448 EVP support, and can't just be swapped since
  # curl-android links against that exact ABI -- so every symbol in the
  # new library is renamed with a kdoss3_ prefix (objcopy) and a matching
  # #define header is shipped so Login.h's own calls resolve to the
  # renamed names too. Zero chance of collision either side.
  # ===================================================================
  build-ed448-lib:
    runs-on: ubuntu-24.04
    outputs:
      built: ${{ steps.build.outcome }}
    steps:
      - name: Set up Android NDK ${{ env.NDK_VERSION }}
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Clone OpenSSL (pinned release)
        run: |
          set -e
          git clone --depth 1 --branch openssl-3.3.2 https://github.com/openssl/openssl /tmp/openssl-src

      - name: Configure + build libcrypto for android-arm64
        id: build
        run: |
          set -e
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          export ANDROID_NDK_ROOT="$NDK"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd /tmp/openssl-src
          ./Configure android-arm64 -D__ANDROID_API__=28 \
            no-shared no-tests no-apps no-engine no-deprecated
          make -j"$(nproc)" build_libs
          ls -la libcrypto.a
          file libcrypto.a

      - name: Rename every global symbol (kdoss3_ prefix)
        run: |
          set -e
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          OBJCOPY="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy"
          AR="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          NM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          cd /tmp/openssl-src

          mkdir -p /tmp/objs && cd /tmp/objs
          "$AR" x /tmp/openssl-src/libcrypto.a

          "$NM" --defined-only -g *.o 2>/dev/null \
            | awk '{print $3}' | sort -u | grep -v '^$' > /tmp/syms.txt
          wc -l /tmp/syms.txt

          awk '{print $1, "kdoss3_" $1}' /tmp/syms.txt > /tmp/redefine.txt

          for o in *.o; do
            "$OBJCOPY" --redefine-syms=/tmp/redefine.txt "$o"
          done

          "$AR" rcs /tmp/libcrypto_kdoss3.a *.o
          "$NM" --defined-only -g /tmp/libcrypto_kdoss3.a | grep -c kdoss3_ || true

          awk '{print "#define " $1 " kdoss3_" $1}' /tmp/syms.txt > /tmp/kd_ossl_rename.h

      - name: Package headers + renamed lib
        run: |
          set -e
          mkdir -p /tmp/ed448lib/include
          cp -r /tmp/openssl-src/include/openssl /tmp/ed448lib/include/openssl
          cp /tmp/libcrypto_kdoss3.a /tmp/ed448lib/libcrypto_kdoss3.a
          cp /tmp/kd_ossl_rename.h /tmp/ed448lib/kd_ossl_rename.h
          cd /tmp/ed448lib && tar czf /tmp/ed448lib.tar.gz .

      - name: Upload (consumed by the main build job)
        uses: actions/upload-artifact@v4
        with:
          name: hardware-bt-ed448lib
          path: /tmp/ed448lib.tar.gz
          if-no-files-found: error

  # ===================================================================
  # ML-DSA-65 (FIPS 204, post-quantum) -- cross-compiles liboqs for
  # android-arm64, ported verbatim from the main InvisibleX workflow's
  # build-mldsa-android-lib job. liboqs' OQS_* symbols don't collide
  # with anything in this project, so no renaming is needed here.
  # ===================================================================
  build-mldsa-android-lib:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Android NDK ${{ env.NDK_VERSION }}
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Clone liboqs (pinned release)
        run: |
          set -e
          git clone --depth 1 --branch 0.12.0 https://github.com/open-quantum-safe/liboqs /tmp/liboqs-src

      - name: Configure + build for android-arm64
        run: |
          set -e
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          cmake -S /tmp/liboqs-src -B /tmp/liboqs-build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DOQS_USE_OPENSSL=OFF \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DOQS_MINIMAL_BUILD="SIG_ml_dsa_65" \
            -DCMAKE_INSTALL_PREFIX=/tmp/liboqs-install-android
          cmake --build /tmp/liboqs-build-android -j"$(nproc)"
          cmake --install /tmp/liboqs-build-android
          ls -la /tmp/liboqs-install-android/lib
          file /tmp/liboqs-install-android/lib/liboqs.a

      - name: Package for the main build job
        run: |
          set -e
          mkdir -p /tmp/liboqs-android-pkg
          cp -r /tmp/liboqs-install-android/lib /tmp/liboqs-android-pkg/lib
          cp -r /tmp/liboqs-install-android/include /tmp/liboqs-android-pkg/include
          cd /tmp/liboqs-android-pkg && tar czf /tmp/liboqs-android.tar.gz .

      - name: Upload (consumed by the main build job)
        uses: actions/upload-artifact@v4
        with:
          name: hardware-bt-liboqs-android
          path: /tmp/liboqs-android.tar.gz
          if-no-files-found: error

  build:
    needs: [build-ed448-lib, build-mldsa-android-lib]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Ed448 lib (from build-ed448-lib job)
        uses: actions/download-artifact@v4
        with:
          name: hardware-bt-ed448lib
          path: /tmp/ed448lib-download

      - name: Unpack Ed448 lib into hardware_bt/includes/external
        run: |
          set -e
          mkdir -p hardware_bt/includes/external/openssl3-ed448
          tar xzf /tmp/ed448lib-download/ed448lib.tar.gz -C hardware_bt/includes/external/openssl3-ed448
          ls -la hardware_bt/includes/external/openssl3-ed448

      - name: Download liboqs (ML-DSA-65) lib (from build-mldsa-android-lib job)
        uses: actions/download-artifact@v4
        with:
          name: hardware-bt-liboqs-android
          path: /tmp/liboqs-android-download

      - name: Unpack liboqs lib into hardware_bt/includes/external
        run: |
          set -e
          mkdir -p hardware_bt/includes/external/liboqs-android
          tar xzf /tmp/liboqs-android-download/liboqs-android.tar.gz -C hardware_bt/includes/external/liboqs-android
          ls -la hardware_bt/includes/external/liboqs-android

      - name: Set up Android NDK ${{ env.NDK_VERSION }}
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      # Same O-MVLL fetch as the main InvisibleX workflow — kept identical
      # so this binary gets the same obfuscation pipeline/version.
      - name: Download O-MVLL plugin (latest linux build)
        run: |
          set -e
          CANDIDATES=(
            "https://open-obfuscator.build38.io/ci/omvll_v1-10-0_linux_2026-09-29T09:26:56.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-11-13T11:32:29.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-11-09T09:56:31.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-10-29T11:58:24.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-10-29T09:09:16.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-10-06T09:20:43.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-10-01T09:30:05.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-09-29T11:51:26.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-09-29T11:41:51.tar.gz"
            "https://open-obfuscator.build38.io/ci/omvll_v1-12-0_linux_2026-09-29T10:01:31.tar.gz"
          )
          URL=""
          for c in "${CANDIDATES[@]}"; do
            echo "Trying: $c"
            if curl -fL --head -s -o /dev/null "$c"; then
              URL="$c"
              break
            fi
          done
          if [ -z "$URL" ]; then
            echo "::error::None of the known O-MVLL build URLs are reachable."
            exit 1
          fi
          echo "Using: $URL"
          curl -fL -o "$HOME/omvll.tar.gz" "$URL"
          mkdir -p "$HOME/omvll"
          tar xzf "$HOME/omvll.tar.gz" -C "$HOME/omvll"

          SO=$(find "$HOME/omvll" -iname "*omvll*.so" | head -1)
          if [ -z "$SO" ]; then
            echo "::error::No .so file found inside the downloaded archive."
            exit 1
          fi
          echo "OMVLL_SO=$SO" >> "$GITHUB_ENV"

          PYDIR=$(find "$HOME/omvll" -maxdepth 2 -type d -iname "Python-*" | head -1)
          if [ -z "$PYDIR" ]; then
            echo "::error::No bundled Python-3.x stdlib folder found inside the archive."
            exit 1
          fi
          echo "OMVLL_PYTHONPATH=$PYDIR/Lib" >> "$GITHUB_ENV"

      - name: Build (ndk-build + O-MVLL)
        id: ndkbuild
        continue-on-error: true
        env:
          OMVLL_CONFIG: ${{ github.workspace }}/hardware_bt/omvll_config.py
        working-directory: hardware_bt
        run: |
          set -o pipefail
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          export LD_LIBRARY_PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/lib:$NDK/toolchains/llvm/prebuilt/linux-x86_64/lib64:${LD_LIBRARY_PATH:-}"
          echo "OMVLL_CONFIG=$OMVLL_CONFIG"
          echo "OMVLL_PYTHONPATH=$OMVLL_PYTHONPATH"
          echo "OMVLL_SO=$OMVLL_SO"
          "$NDK/ndk-build" \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=jni/Application.mk \
            OMVLL_PLUGIN="$OMVLL_SO" \
            V=1 \
            -j"$(nproc)" 2>&1 | tee /tmp/build.log

      - name: Report build failure as an issue
        if: steps.ndkbuild.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Hardware BT build failed on run ${{ github.run_id }} (commit ${{ github.sha }})."
            echo
            echo '```'
            tail -c 55000 /tmp/build.log
            echo '```'
          } > /tmp/build_tail.md
          gh issue create --repo "${{ github.repository }}" \
            --title "Hardware BT CI build failure: run ${{ github.run_id }}" \
            --body-file /tmp/build_tail.md

      - name: Fail job if the build step failed
        if: steps.ndkbuild.outcome == 'failure'
        run: exit 1

      - name: Show result
        working-directory: hardware_bt
        run: |
          echo "=== built binary ==="
          ls -la libs/arm64-v8a/ || true
          file libs/arm64-v8a/client.sh || true

      - name: Upload client.sh (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hardware-bt-client-arm64
          path: hardware_bt/libs/arm64-v8a/client.sh
          if-no-files-found: error
