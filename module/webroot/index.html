<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InvisibleX</title>
<style>
:root{
  --bg0:#07080c; --bg1:#0d1018; --bg2:#121726;
  --panel:#141a2b; --panel2:#1b2236;
  --edge:rgba(255,255,255,0.07);
  --accent:#ff3366; --accent2:#7c4dff; --gold:#e9c46a;
  --ok:#2bd97c; --warn:#ffb020; --bad:#ff4d4f;
  --text:#eef0f6; --text-dim:#8d93a6;
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg0);color:var(--text);
  font-family:-apple-system,"SF Pro Display",Roboto,"Segoe UI",system-ui,sans-serif;
  height:100%;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(124,77,255,0.20), transparent 60%),
    radial-gradient(900px 500px at 100% 110%, rgba(255,51,102,0.14), transparent 60%),
    linear-gradient(180deg,var(--bg0),var(--bg1) 40%,var(--bg0));
  min-height:100vh;
}
.app{max-width:460px;margin:0 auto;padding:22px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.brand .mark{width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;
  box-shadow:0 6px 20px rgba(255,51,102,0.35)}
.brand .name{font-weight:700;font-size:19px;letter-spacing:0.3px}
.brand .name b{color:var(--gold);font-weight:800}

.card{background:linear-gradient(160deg,var(--panel),var(--panel2));
  border:1px solid var(--edge);border-radius:var(--radius);
  padding:20px;margin-bottom:16px;position:relative;overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.35)}
.card::before{content:"";position:absolute;inset:0;border-radius:var(--radius);
  background:linear-gradient(135deg,rgba(255,255,255,0.05),transparent 40%);pointer-events:none}

.hidden{display:none !important}

/* ---------- LOGIN ---------- */
#view-login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.hero{text-align:center;margin-bottom:6px}
.hero .glow{font-size:13px;letter-spacing:3px;color:var(--text-dim);text-transform:uppercase}
.hero h1{font-size:30px;margin:6px 0 0;font-weight:800;
  background:linear-gradient(90deg,#fff,#cfd3e6);
  -webkit-background-clip:text;background-clip:text;color:transparent}

label{display:block;font-size:12px;color:var(--text-dim);margin:0 0 7px;letter-spacing:0.4px;text-transform:uppercase}
input[type=text]{width:100%;background:#0b0e18;border:1px solid var(--edge);color:var(--text);
  padding:14px 14px;border-radius:12px;font-size:16px;letter-spacing:1px;outline:none;
  transition:border-color .15s}
input[type=text]:focus{border-color:var(--accent2)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px 16px;border-radius:12px;border:none;font-size:15px;font-weight:700;
  cursor:pointer;letter-spacing:0.3px;transition:transform .08s,filter .15s}
.btn:active{transform:scale(0.98)}
.btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;
  box-shadow:0 8px 24px rgba(255,51,102,0.3)}
.btn-primary:disabled{filter:grayscale(0.6) brightness(0.7);cursor:not-allowed}
.btn-ghost{background:var(--panel2);color:var(--text);border:1px solid var(--edge)}
.btn-stop{background:linear-gradient(90deg,#5a1e1e,#7a2323);color:#fff}
.btn-start{background:linear-gradient(90deg,#1e5a35,#239c56);color:#fff}

.msg{font-size:13px;text-align:center;min-height:18px;color:var(--text-dim)}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--ok)}

/* ---------- HOME ---------- */
#view-home{display:none;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;justify-content:space-between}
.pill{font-size:11px;padding:5px 10px;border-radius:20px;letter-spacing:0.5px;font-weight:700}
.pill-on{background:rgba(43,217,124,0.15);color:var(--ok);border:1px solid rgba(43,217,124,0.35)}
.pill-off{background:rgba(255,255,255,0.06);color:var(--text-dim);border:1px solid var(--edge)}

.status-card{display:flex;align-items:center;justify-content:space-between}
.status-left{display:flex;align-items:center;gap:14px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--text-dim);box-shadow:0 0 0 0 rgba(0,0,0,0)}
.dot.live{background:var(--ok);box-shadow:0 0 0 4px rgba(43,217,124,0.18);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(43,217,124,0.35)}70%{box-shadow:0 0 0 10px rgba(43,217,124,0)}100%{box-shadow:0 0 0 0 rgba(43,217,124,0)}}
.status-title{font-weight:700;font-size:16px}
.status-sub{font-size:12px;color:var(--text-dim);margin-top:2px}

.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;
  border-bottom:1px solid var(--edge)}
.row:last-child{border-bottom:none}
.row-label{font-size:14px;font-weight:600}
.row-sub{font-size:11px;color:var(--text-dim);margin-top:2px}

select{background:#0b0e18;color:var(--text);border:1px solid var(--edge);border-radius:10px;
  padding:9px 12px;font-size:14px;outline:none;min-width:140px}

.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#2a3147;border-radius:30px;cursor:pointer;transition:.2s}
.slider::before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;
  background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,0.3)}
input:checked + .slider{background:linear-gradient(90deg,var(--accent),var(--accent2))}
input:checked + .slider::before{transform:translateX(22px)}

.seg{display:flex;background:#0b0e18;border-radius:12px;border:1px solid var(--edge);padding:4px}
.seg button{flex:1;padding:9px 0;border:none;background:transparent;color:var(--text-dim);
  font-weight:700;font-size:13px;border-radius:9px;cursor:pointer}
.seg button.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}

.remote-link{display:block;margin-top:10px;font-size:13px;color:var(--gold);word-break:break-all;
  text-decoration:none;border:1px dashed rgba(233,196,106,0.4);padding:10px;border-radius:10px}

.footer{margin-top:auto;padding-top:16px;text-align:center;font-size:11px;color:var(--text-dim)}
</style>
</head>
<body>
<div class="app">

  <div class="brand">
    <div class="mark">X</div>
    <div class="name">Invisible<b>X</b></div>
  </div>

  <!-- ===================== LOGIN ===================== -->
  <div id="view-login">
    <div class="hero">
      <div class="glow">Secure Access</div>
      <h1>Enter your key</h1>
    </div>
    <div class="card">
      <label>License key</label>
      <input id="keyInput" type="text" placeholder="X-XXXXXXXX" autocapitalize="characters" autocomplete="off">
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">Unlock</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- ===================== HOME ===================== -->
  <div id="view-home">

    <div class="topbar">
      <span class="pill" id="connPill">...</span>
      <button class="btn-ghost" style="width:auto;padding:7px 12px;font-size:12px;border-radius:9px"
        onclick="logout()">Switch key</button>
    </div>

    <div class="card status-card">
      <div class="status-left">
        <div class="dot" id="statusDot"></div>
        <div>
          <div class="status-title" id="statusTitle">Checking…</div>
          <div class="status-sub" id="statusSub">&nbsp;</div>
        </div>
      </div>
      <button class="btn btn-start" id="toggleBtn" style="width:auto;padding:12px 22px"
        onclick="toggleRun()">Start</button>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <div class="row-label">Control mode</div>
          <div class="row-sub">Local = this screen. Remote = control from the web panel.</div>
        </div>
      </div>
      <div class="seg" style="margin-top:4px">
        <button id="segLocal" class="active" onclick="setMode('local')">Local</button>
        <button id="segRemote" onclick="setMode('remote')">Remote</button>
      </div>
      <a class="remote-link hidden" id="remoteLink" href="#" target="_blank">—</a>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <div class="row-label">Driver</div>
          <div class="row-sub">Which KPM backend reads/writes memory</div>
        </div>
        <select id="driverSelect" onchange="setDriver(this.value)">
          <option value="auto">Auto</option>
          <option value="qx1">QX1</option>
          <option value="gt">GT</option>
          <option value="rt-dev">RT-DEV</option>
          <option value="rt-proc">RT-PROC</option>
          <option value="qx2">QX2</option>
          <option value="tb-kpm">TB-KPM</option>
          <option value="ditpro">DitPro</option>
          <option value="kma">KMA</option>
          <option value="ldk">LDK</option>
          <option value="paradise">Paradise</option>
        </select>
      </div>
      <div class="row">
        <div>
          <div class="row-label">Open menu with</div>
          <div class="row-sub">Volume button, or tap the on-screen bar</div>
        </div>
        <div class="seg" style="max-width:160px">
          <button id="segBar" class="active" onclick="setMenu('bar')">Bar</button>
          <button id="segVol" onclick="setMenu('vol')">Volume</button>
        </div>
      </div>
    </div>

    <div class="footer">InvisibleX Loader · WebUI</div>
  </div>

</div>

<script>
/* ---------- root-WebUI exec bridge (KernelSU / APatch) ---------- */
function kdHasBridge(){ return !!(window.ksu && window.ksu.exec) || !!(window.apatch && window.apatch.exec); }
async function kdExec(cmd){
  if (window.ksu && window.ksu.exec) return await window.ksu.exec(cmd);
  if (window.apatch && window.apatch.exec) return await window.apatch.exec(cmd);
  throw new Error('no-bridge');
}
const KD_CTL = "/data/adb/modules/invisiblex_loader/bin/kd_ctl";
async function kd(args){
  if (!kdHasBridge()){
    return {errno:-1, stdout:'', stderr:'no-bridge'};
  }
  const r = await kdExec(KD_CTL + ' ' + args);
  let j = {};
  try { j = JSON.parse((r.stdout||'').trim().split('\n').pop()); } catch(e) {}
  return Object.assign({errno:r.errno, stderr:r.stderr}, j);
}

/* ---------- state ---------- */
let pollTimer = null;

function showLogin(){
  document.getElementById('view-login').style.display = 'flex';
  document.getElementById('view-home').style.display = 'none';
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}
function showHome(){
  document.getElementById('view-login').style.display = 'none';
  document.getElementById('view-home').style.display = 'flex';
  refreshStatus();
  pollTimer = setInterval(refreshStatus, 4000);
}

function setMsg(text, cls){
  const m = document.getElementById('loginMsg');
  m.textContent = text;
  m.className = 'msg' + (cls ? ' ' + cls : '');
}

async function doLogin(){
  const key = document.getElementById('keyInput').value.trim().toUpperCase();
  if (!key){ setMsg('Enter your license key.', 'err'); return; }
  if (!kdHasBridge()){
    setMsg('Open this page from the KernelSU/APatch manager app (not a normal browser).', 'err');
    return;
  }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Verifying…';
  setMsg('Checking with server…');
  const r = await kd('login ' + key.replace(/[^A-Za-z0-9-]/g,''));
  btn.disabled = false; btn.textContent = 'Unlock';
  if (r.ok){
    setMsg('');
    localStorage.setItem('kd_logged_in','1');
    showHome();
  } else {
    setMsg(r.error || 'Login failed. Please try again.', 'err');
  }
}

function logout(){
  localStorage.removeItem('kd_logged_in');
  document.getElementById('keyInput').value = '';
  showLogin();
}

async function refreshStatus(){
  const r = await kd('status');
  const pill = document.getElementById('connPill');
  if (!kdHasBridge()){
    pill.textContent = 'NO BRIDGE'; pill.className = 'pill pill-off';
    return;
  }
  pill.textContent = 'CONNECTED'; pill.className = 'pill pill-on';

  const dot = document.getElementById('statusDot');
  const title = document.getElementById('statusTitle');
  const sub = document.getElementById('statusSub');
  const toggleBtn = document.getElementById('toggleBtn');

  if (r.running){
    dot.className = 'dot live';
    title.textContent = 'Running';
    sub.textContent = 'Overlay is live on this device';
    toggleBtn.textContent = 'Stop';
    toggleBtn.className = 'btn btn-stop';
  } else {
    dot.className = 'dot';
    title.textContent = 'Stopped';
    sub.textContent = r.has_saved_key ? 'Ready to start' : 'No saved license — login again';
    toggleBtn.textContent = 'Start';
    toggleBtn.className = 'btn btn-start';
  }

  if (r.driver) document.getElementById('driverSelect').value = r.driver;
  if (r.menu_open){
    document.getElementById('segBar').classList.toggle('active', r.menu_open === 'bar');
    document.getElementById('segVol').classList.toggle('active', r.menu_open === 'vol');
  }
}

async function toggleRun(){
  const btn = document.getElementById('toggleBtn');
  const running = btn.textContent.trim() === 'Stop';
  btn.disabled = true;
  await kd(running ? 'stop' : 'start');
  btn.disabled = false;
  refreshStatus();
}

async function setDriver(name){
  await kd('set-driver ' + name);
}
async function setMenu(mode){
  document.getElementById('segBar').classList.toggle('active', mode === 'bar');
  document.getElementById('segVol').classList.toggle('active', mode === 'vol');
  await kd('set-menu ' + mode);
}

/* ---------- local / remote mode ---------- */
// Set the real panel URL here once (same one delivered earlier as agent_panel.php).
const REMOTE_PANEL_URL = "https://adminshop.myvipsite.fun/kd/agent_panel.php";

function setMode(mode){
  document.getElementById('segLocal').classList.toggle('active', mode === 'local');
  document.getElementById('segRemote').classList.toggle('active', mode === 'remote');
  const link = document.getElementById('remoteLink');
  if (mode === 'remote'){
    link.classList.remove('hidden');
    link.href = REMOTE_PANEL_URL;
    link.textContent = REMOTE_PANEL_URL;
  } else {
    link.classList.add('hidden');
  }
  localStorage.setItem('kd_mode', mode);
}

/* ---------- boot ---------- */
(function init(){
  const savedMode = localStorage.getItem('kd_mode') || 'local';
  setMode(savedMode);
  if (localStorage.getItem('kd_logged_in') === '1'){
    showHome();
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
