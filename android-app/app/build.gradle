plugins {
    id 'com.android.application'
}

android {
    namespace 'com.invisiblex.loader'
    compileSdk 34

    defaultConfig {
        applicationId "com.invisiblex.loader"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            // Only arm64-v8a prebuilt libs (libsodium/libcurl/libssl/libcrypto)
            // are vendored under app/src/main/cpp/external — matches the
            // main INX.SH binary, which is arm64-only too.
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // Support for custom APK rename via Settings
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "InvisibleX-${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // Networking + JSON for the login protocol now live natively in
    // ix_auth.cpp (libcurl + nlohmann/json) — the server only accepts
    // the double-encrypted wire protocol, so OkHttp/org.json have no
    // remaining job on the Java side (see NativeAuth / AuthClient).
}
