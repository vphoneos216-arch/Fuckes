apply plugin: 'com.android.application'
// [UPDATED] the original file began with a stray "krlh" prefix glued onto
// this line (corrupted/leftover bytes, confirmed by reading the raw file —
// not a real Gradle directive), which made the whole file fail to parse.
// Removed; nothing else about the line changed.

android {
    namespace "com.idragoncheats.studiopro"
    compileSdkVersion 29
    buildToolsVersion "29.0.3"
    ndkVersion "21.4.7075529"

    defaultConfig {
        applicationId "com.idragoncheats.studiopro"
        minSdkVersion 21        // was 14 — raised to 21 to match
                                 // Application.mk's APP_PLATFORM := android-21;
                                 // a minSdk below the NDK build's own target
                                 // platform is inconsistent, not a feature.
        targetSdkVersion 29
        versionCode 1
        versionName "GS MODZ"
        ndk {
            abiFilters "arm64-v8a"   // matches Application.mk's APP_ABI
        }
        externalNativeBuild {
            ndkBuild {
                arguments "APP_STL=c++_static", "APP_PLATFORM=android-21"
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // [UPDATED] added: AGP's lintVitalRelease task was failing the whole
    // release build over "ExpiredTargetSdkVersion" (Google Play's targetSdk
    // policy) — irrelevant for this build since it is never going to the
    // Play Store, just sideloaded/injected. Confirmed via the actual CI log.
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    // [NEW] jni/injector/injector.cpp builds as a plain executable
    // (Android.mk explains why it can't be named with a .so extension
    // directly — NDK rejects a dot anywhere in an executable's output
    // name). AGP's native-lib merge only picks up files ending in .so, so
    // this extra source dir plus the copy task below gets the real
    // compiled executable into the APK under a .so-shaped name — the file
    // itself is untouched, only the copy's filename changes.
    sourceSets {
        main {
            jniLibs.srcDirs += "$buildDir/injectorLibs"
        }
    }
}

// Finds ndk-build's real "injector" executable output (wherever AGP's
// per-build hashed intermediates directory put it — that hash changes
// between builds, hence the glob instead of a fixed path) and copies it
// into the extra jniLibs source dir above, renamed to libinjector.so.
// Wired to run after the native build and before native libs get merged,
// for every build-type/ABI variant task AGP generates.
afterEvaluate {
    tasks.matching { it.name.startsWith("externalNativeBuild") && !it.name.contains("Clean") }.configureEach { nativeTask ->
        def variant = nativeTask.name - "externalNativeBuild"
        def copyTask = tasks.register("copyInjectorAsSo${variant}", Copy) {
            dependsOn nativeTask
            from(fileTree(dir: "$buildDir/intermediates/cxx") {
                include "**/lib/arm64-v8a/injector"
            })
            into "$buildDir/injectorLibs/arm64-v8a"
            rename { "libinjector.so" }
        }
        tasks.matching { it.name == "merge${variant}JniLibFolders" || it.name == "merge${variant}NativeLibs" }.configureEach {
            dependsOn copyTask
        }
    }
}
